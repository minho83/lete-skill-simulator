<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레테 스킬 시뮬레이터 - 웹 버전</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
        }
        
        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.95rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        
        .tabs-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            min-width: max-content;
        }
        
        .tab {
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            white-space: nowrap;
            font-weight: 600;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .tab-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        
        .search-box {
            margin-bottom: 20px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 45px 15px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .skill-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        
        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .skill-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .skill-card:hover::before {
            opacity: 0.5;
        }
        
        .skill-card.unpurchased {
            opacity: 0.5;
            filter: grayscale(0.7);
        }
        
        .skill-card.max-level {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }
        
        .skill-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .skill-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #e4e4e4;
        }
        
        .skill-max-level {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 12px;
        }
        
        .skill-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
        }
        
        .skill-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .skill-btn:hover:not(:disabled) {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
            transform: scale(1.1);
        }
        
        .skill-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .skill-level-display {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        .category-fire { color: #ef4444; }
        .category-ice { color: #3b82f6; }
        .category-lightning { color: #eab308; }
        .category-psychic { color: #a855f7; }
        .category-fusion { color: #f97316; }
        .category-strength { color: #10b981; }
        .category-agility { color: #06b6d4; }
        .category-support { color: #f0abfc; }
        .category-harmony { color: #84cc16; }
        .category-bravery { color: #dc2626; }
        .category-fortitude { color: #78716c; }
        .category-solitude { color: #1e40af; }
        .category-cunning { color: #64748b; }
        .category-utility { color: #f59e0b; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .export-code {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 15px;
            color: #a0aec0;
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            
            .skills-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 100;
            display: none;
            max-width: 250px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <div class="header">
            <h1 class="title">⚔️ 레테 스킬 시뮬레이터 ⚔️</h1>
            
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-label">총 사용 포인트</div>
                    <div class="stat-value" id="totalPoints">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">필요 레벨</div>
                    <div class="stat-value" id="requiredLevel">1</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">힘 (Strength)</div>
                    <div class="stat-value" id="strengthStat">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">민첩 (Agility)</div>
                    <div class="stat-value" id="agilityStat">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">지력 (Intellect)</div>
                    <div class="stat-value" id="intellectStat">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">스킬 습득</div>
                    <div class="stat-value" id="skillsLearned">0 / 305</div>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveProgress()">
                    <i class="fas fa-save"></i> 저장하기
                </button>
                <button class="btn btn-success" onclick="loadProgress()">
                    <i class="fas fa-upload"></i> 불러오기
                </button>
                <button class="btn btn-primary" onclick="exportBuild()">
                    <i class="fas fa-share-alt"></i> 빌드 공유
                </button>
                <button class="btn btn-danger" onclick="resetAll()">
                    <i class="fas fa-redo"></i> 초기화
                </button>
            </div>
        </div>
        
        <div class="tabs-container">
            <div class="tabs" id="categoryTabs"></div>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="스킬 검색..." onkeyup="filterSkills()">
            <i class="fas fa-search search-icon"></i>
        </div>
        
        <div id="skillsContainer"></div>
    </div>
    
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">빌드 코드 공유</div>
            <div class="export-code" id="exportCode"></div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="copyToClipboard()">
                    <i class="fas fa-copy"></i> 복사하기
                </button>
                <button class="btn btn-danger" onclick="closeModal()">
                    <i class="fas fa-times"></i> 닫기
                </button>
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>

        function initializeTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';
            
            Object.keys(skillsData).forEach(category => {
                const tab = document.createElement('div');
                tab.className = `tab ${category === currentCategory ? 'active' : ''}`;
                tab.style.color = categoryColors[category];
                tab.innerHTML = `
                    ${categoryIcons[category]} ${category}
                    <span class="tab-badge">${skillsData[category].length}</span>
                `;
                tab.onclick = () => switchCategory(category);
                tabsContainer.appendChild(tab);
            });
        }
        
        function switchCategory(category) {
            currentCategory = category;
            initializeTabs();
            renderSkills();
        }
        
        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            const skills = skillsData[currentCategory];
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredSkills = skills.filter(skill => 
                skill.name.toLowerCase().includes(searchTerm)
            );
            
            container.innerHTML = '<div class="skills-grid">' + filteredSkills.map(skill => {
                const current = currentSkills[skill.id];
                const cardClass = current === 0 ? 'unpurchased' : (current === skill.maxLevel ? 'max-level' : '');
                const progress = (current / skill.maxLevel) * 100;
                
                return `
                    <div class="skill-card ${cardClass}" onmouseenter="showTooltip(event, ${skill.id})" onmouseleave="hideTooltip()">
                        <div class="skill-icon" style="background: ${categoryColors[currentCategory]}33; border-color: ${categoryColors[currentCategory]};">
                            Img ${skill.id}
                        </div>
                        <div class="skill-name">${skill.name}</div>
                        <div class="skill-max-level">MAX Lv.${skill.maxLevel}</div>
                        <div class="skill-controls">
                            <button class="skill-btn" onclick="decreaseSkill(${skill.id})" ${current === 0 ? 'disabled' : ''}>
                                <i class="fas fa-minus"></i>
                            </button>
                            <div class="skill-level-display">
                                ${current} / ${skill.maxLevel}
                            </div>
                            <button class="skill-btn" onclick="increaseSkill(${skill.id})" ${current >= skill.maxLevel ? 'disabled' : ''}>
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%; background: ${categoryColors[currentCategory]};"></div>
                        </div>
                    </div>
                `;
            }).join('') + '</div>';
        }
        
        function increaseSkill(skillId) {
            const skill = findSkillById(skillId);
            if (skill && currentSkills[skillId] < skill.maxLevel) {
                currentSkills[skillId]++;
                updateStats();
                renderSkills();
                autoSave();
            }
        }
        
        function decreaseSkill(skillId) {
            if (currentSkills[skillId] > 0) {
                currentSkills[skillId]--;
                updateStats();
                renderSkills();
                autoSave();
            }
        }
        
        function findSkillById(id) {
            for (const category in skillsData) {
                const skill = skillsData[category].find(s => s.id === id);
                if (skill) return skill;
            }
            return null;
        }
        
        function getCategoryForSkillId(id) {
            for (const category in skillsData) {
                if (skillsData[category].find(s => s.id === id)) {
                    return category;
                }
            }
            return "";
        }
        
        function updateStats() {
            const totalPoints = Object.values(currentSkills).reduce((sum, val) => sum + val, 0);
            const requiredLevel = Math.max(1, Math.ceil(totalPoints / 3) + 1);
            
            // Calculate stats based on categories
            let strength = 0;
            let agility = 0;
            let intellect = 0;
            let skillsLearned = 0;
            
            Object.keys(currentSkills).forEach(skillId => {
                const points = currentSkills[skillId];
                if (points > 0) skillsLearned++;
                
                const category = getCategoryForSkillId(parseInt(skillId));
                
                if (["힘 능력", "용맹 특성", "강인 특성", "조화 능력"].includes(category)) {
                    strength += points;
                }
                if (["민첩 능력", "고독 특성", "교활 특성"].includes(category)) {
                    agility += points;
                }
                if (["화염 마법", "얼음 마법", "번개 마법", "초능력 마법", "융합 마법", "보조 능력", "유용 특성"].includes(category)) {
                    intellect += points;
                }
            });
            
            document.getElementById('totalPoints').textContent = totalPoints;
            document.getElementById('requiredLevel').textContent = requiredLevel;
            document.getElementById('strengthStat').textContent = strength;
            document.getElementById('agilityStat').textContent = agility;
            document.getElementById('intellectStat').textContent = intellect;
            document.getElementById('skillsLearned').textContent = `${skillsLearned} / 305`;
        }
        
        function filterSkills() {
            renderSkills();
        }
        
        function saveProgress() {
            localStorage.setItem('skillSimulatorData', JSON.stringify(currentSkills));
            alert('진행 상황이 저장되었습니다! ✅');
        }
        
        function autoSave() {
            localStorage.setItem('skillSimulatorData', JSON.stringify(currentSkills));
        }
        
        function loadProgress() {
            const saved = localStorage.getItem('skillSimulatorData');
            if (saved) {
                currentSkills = JSON.parse(saved);
                updateStats();
                renderSkills();
                alert('저장된 데이터를 불러왔습니다! 📥');
            } else {
                alert('저장된 데이터가 없습니다.');
            }
        }
        
        function resetAll() {
            if (confirm('모든 스킬 포인트를 초기화하시겠습니까? 🔄')) {
                Object.keys(currentSkills).forEach(key => {
                    currentSkills[key] = 0;
                });
                updateStats();
                renderSkills();
                autoSave();
                alert('초기화 완료! ✨');
            }
        }
        
        function exportBuild() {
            const buildData = Object.keys(currentSkills)
                .filter(id => currentSkills[id] > 0)
                .map(id => `${id}:${currentSkills[id]}`)
                .join(',');
            
            const buildCode = btoa(buildData);
            
            document.getElementById('exportCode').textContent = buildCode;
            document.getElementById('exportModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('exportModal').classList.remove('active');
        }
        
        function copyToClipboard() {
            const code = document.getElementById('exportCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('빌드 코드가 클립보드에 복사되었습니다! 📋');
            });
        }
        
        function showTooltip(event, skillId) {
            const skill = findSkillById(skillId);
            if (!skill) return;
            
            const tooltip = document.getElementById('tooltip');
            const current = currentSkills[skillId];
            
            tooltip.innerHTML = `
                <strong>${skill.name}</strong><br>
                현재 레벨: ${current} / ${skill.maxLevel}<br>
                카테고리: ${getCategoryForSkillId(skillId)}
            `;
            
            tooltip.style.display = 'block';
            tooltip.style.left = event.pageX + 15 + 'px';
            tooltip.style.top = event.pageY + 15 + 'px';
        }
        
        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved data if exists
            const saved = localStorage.getItem('skillSimulatorData');
            if (saved) {
                currentSkills = JSON.parse(saved);
            }
            
            initializeTabs();
            renderSkills();
            updateStats();
        });
        
        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
